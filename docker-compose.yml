version: "3.9"

networks:
  federated-net:
    driver: bridge

# ---------- shared templates ----------
x-ids-agent-base: &ids-agent-base
  image: agentic-ids:latest
  depends_on:
    fl-server:
      condition: service_started
  networks:
    - federated-net
  restart: unless-stopped

x-pkt-streamer-base: &pkt-streamer-base
  image: pkt-streamer:latest
  volumes:
    - ./pkt-streamer/data:/data:ro
  networks:
    - federated-net
  restart: unless-stopped

# ---------- services ----------
services:

  fl-server:
    build:
      context: ./fl-server
    image: fl-server:latest
    ports:
      - "9090:9090"
    environment:
      - PORT=9090
      - FL_PRIVACY_LOG_PATH=/app/privacy_logs
      - FL_TARGET_EPSILON=10.0
      - FL_NOISE_MULTIPLIER=1.0
    volumes:
      - ./fl-server/privacy_logs:/app/privacy_logs
    networks:
      - federated-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090"]
      interval: 10s
      timeout: 3s
      retries: 5

  # -------- IDS AGENTS --------

  ids-agent-org-a:
    <<: *ids-agent-base
    build:
      context: ./agentic-ids-local
    environment:
      - ORG_ID=org-a
      - FL_SERVER_URL=http://fl-server:9090
      - AGENT_PORT=5001
      - PORT=5001

  ids-agent-org-b:
    <<: *ids-agent-base
    environment:
      - ORG_ID=org-b
      - FL_SERVER_URL=http://fl-server:9090
      - AGENT_PORT=5002
      - PORT=5002

  ids-agent-org-c:
    <<: *ids-agent-base
    environment:
      - ORG_ID=org-c
      - FL_SERVER_URL=http://fl-server:9090
      - AGENT_PORT=5003
      - PORT=5003

  # -------- PKT STREAMERS --------

  pkt-streamer-org-a:
    <<: *pkt-streamer-base
    build:
      context: ./pkt-streamer
    depends_on:
      - ids-agent-org-a
    environment:
      - ORG_ID=org-a
      - API_URL=http://ids-agent-org-a:5001/detect
      - CSV_PATH=/data/UNSW-NB15_1.csv
      - FEATURES_METADATA=/data/dataset_features.json
      - API_TIMEOUT=0.5
      - STREAM_DELAY=1
      - DROP_COLUMNS=attack_cat,Label

  pkt-streamer-org-b:
    <<: *pkt-streamer-base
    depends_on:
      - ids-agent-org-b
    environment:
      - ORG_ID=org-b
      - API_URL=http://ids-agent-org-b:5002/detect
      - CSV_PATH=/data/UNSW-NB15_2.csv
      - FEATURES_METADATA=/data/dataset_features.json
      - API_TIMEOUT=0.5
      - STREAM_DELAY=1
      - DROP_COLUMNS=attack_cat,Label

  pkt-streamer-org-c:
    <<: *pkt-streamer-base
    depends_on:
      - ids-agent-org-c
    environment:
      - ORG_ID=org-c
      - API_URL=http://ids-agent-org-c:5003/detect
      - CSV_PATH=/data/UNSW-NB15_3.csv
      - FEATURES_METADATA=/data/dataset_features.json
      - API_TIMEOUT=0.5
      - STREAM_DELAY=1
      - DROP_COLUMNS=attack_cat,Label
