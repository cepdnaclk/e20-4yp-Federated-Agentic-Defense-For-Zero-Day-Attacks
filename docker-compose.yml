services:
  # The IDS Agent (Receiver)
  agentic-ids-local:
    build:
      context: ./agentic-ids-local  # Path to the folder containing your Agent Dockerfile
    ports:
      - "5000:5000"
    networks:
      - ids-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The Federated Learning Server
  fl-server:
    build:
      context: ./federation_simulation
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    networks:
      - ids-network
    volumes:
      - ./federation_simulation/knowledge_base:/app/knowledge_base
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # The Packet Streamer (Sender)
  pkt-streamer:
    build:
      context: ./pkt-streamer      # Path to the folder containing your Streamer Dockerfile
    depends_on:
      agentic-ids-local:
        condition: service_healthy
    networks:
      - ids-network
    environment:
      - CSV_PATH=/data/UNSW-NB15_1.csv
      - FEATURES_METADATA=/data/dataset_features.json
      - API_URL=http://agentic-ids-local:5000/detect
      - API_TIMEOUT=0.5
      - STREAM_DELAY=3
      - DROP_COLUMNS=attack_cat,Label
    volumes:
      # Mount your local dataset folder to the container's /data path
      - ./data:/data:ro

networks:
  ids-network:
    driver: bridge