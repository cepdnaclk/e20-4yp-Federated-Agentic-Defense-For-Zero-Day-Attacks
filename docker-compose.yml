services:
  # The IDS Agent (Receiver)
  local-agentic-ids:
    build:
      context: ./agentic-ids-local  # Path to the folder containing your Agent Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FL_SERVER_URL=http://fl-server:8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      fl-server:
        condition: service_started

  # The Packet Streamer (Sender)
  pkt-streamer:
    build:
      context: ./pkt-streamer      # Path to the folder containing your Streamer Dockerfile
    depends_on:
      local-agentic-ids:
        condition: service_healthy
    environment:
      - CSV_PATH=/data/UNSW-NB15_1.csv
      - FEATURES_METADATA=/data/dataset_features.json
      - API_URL=http://local-agentic-ids:5000/detect
      - API_TIMEOUT=0.5
      - STREAM_DELAY=3
      - DROP_COLUMNS=attack_cat,Label
    volumes:
      # Mount your local dataset folder to the container's /data path
      - ./data:/data:ro

  # The Federated Learning Server (Global Aggregator)
  fl-server:
    build:
      context: ./federation_simulation
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5